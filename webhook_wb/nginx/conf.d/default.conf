    server {
        listen 80;
        server_name 159.223.135.248;
        
        # Security headers
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy "strict-origin";
        
        # Static files handling (images, CSS, JS)
        location /static/ {
            alias /app/static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
            
            # Handle image files specifically
            location ~* \.(jpg|jpeg|png|gif|ico|webp|svg)$ {
                expires 30d;
                add_header Cache-Control "public, no-transform";
                try_files $uri $uri/ =404;
            }
        }
        
        # Central Admin Panel
        location / {
            proxy_pass http://central-admin:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
        
        # Bot APIs
        location ~ ^/api/(?<bot_id>\w+)/(?<path>.*)$ {
            # Determine port based on bot_id
            set $bot_port 3001;
            if ($bot_id = "bot2") {
                set $bot_port 3002;
            }
            if ($bot_id = "bot3") {
                set $bot_port 3003;
            }
            
            proxy_pass http://$bot_id:$bot_port/api/$path$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Error pages
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
