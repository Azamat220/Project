<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>WhatsApp Bot Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <style>
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }
        .bot-card {
            cursor: pointer;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="text-center mb-5">
            <h1 class="display-4 mb-3"><i class="bi bi-whatsapp me-2"></i>WhatsApp Bot Manager</h1>
            <p class="lead">Выберите бота для управления</p>
        </div>

        <div class="row row-cols-1 row-cols-md-3 g-4">
            {% for bot_id in bots %}
            <div class="col">
                <div class="card bot-card h-100" onclick="window.location='/manage/{{ bot_id }}'">
                    <div class="card-body text-center">
                        <div class="mb-3">
                            <i class="bi bi-robot display-4 text-primary"></i>
                        </div>
                        <h3 class="card-title">{{ bot_id|upper }}</h3>
                        <p class="card-text">Нажмите для управления этим ботом</p>
                    </div>
                    <div class="card-footer">
                        <small class="text-muted">Требуется авторизация</small>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
