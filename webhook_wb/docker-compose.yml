version: '3.8'

services:
  # Bot Services
  bot1:
    build: ./node-decide
    container_name: bot1
    environment:
      - BOT_ID=bot1
      - PORT=3001
      - PRICE_SHEET_ID=${PRICE_SHEET_ID}
      - SHEET=${SHEET}
      - DB_FILE=/data/bots/bot1/conversations.db
      - PROMPT_FILE=/data/bots/bot1/prompt.txt
      - IMAGE_PROMPT_FILE=/data/bots/bot1/image_prompt.txt
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_SHEETS_CREDENTIALS=${GOOGLE_SHEETS_CREDENTIALS}
      - GOOGLE_SHEET_ID=${GOOGLE_SHEET_ID}
      - GOOGLE_SHEET_NAME=${GOOGLE_SHEET_NAME}
      - OPENAI_ADMIN_KEY=${OPENAI_ADMIN_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN_1}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID_1}
    volumes:
      - ./sessions/bot1:/app/.wwebjs_auth
      - ./shared:/data
      - ./shared/secrets/gcp.json:/secrets/gcp.json
      - ./static:/app/static
    restart: unless-stopped
    networks:
      - whatsapp-net

  bot2:
    build: ./node-bot2
    container_name: bot2
    environment:
      - BOT_ID=bot2
      - PORT=3002
      - PRICE_SHEET_ID=${PRICE_SHEET_ID}
      - SHEET=${SHEET}
      - DB_FILE=/data/bots/bot2/conversations.db
      - PROMPT_FILE=/data/bots/bot2/prompt.txt
      - IMAGE_PROMPT_FILE=/data/bots/bot2/image_prompt.txt
      - OPENAI_API_KEY=${OPENAI_API_KEY_2}
      - GOOGLE_SHEETS_CREDENTIALS=${GOOGLE_SHEETS_CREDENTIALS}
      - GOOGLE_SHEET_ID=${GOOGLE_SHEET_ID}
      - GOOGLE_SHEET_NAME=${GOOGLE_SHEET_NAME}
      - OPENAI_ADMIN_KEY=${OPENAI_ADMIN_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN_2}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID_2}
    volumes:
      - ./sessions/bot2:/app/.wwebjs_auth
      - ./shared:/data
      - ./shared/secrets/gcp.json:/secrets/gcp.json
      - ./static:/app/static
    restart: unless-stopped
    networks:
      - whatsapp-net

  bot3:
    build: ./node-bot3
    container_name: bot3
    environment:
      - BOT_ID=bot3
      - PORT=3003
      - PRICE_SHEET_ID=${PRICE_SHEET_ID}
      - SHEET=${SHEET}
      - DB_FILE=/data/bots/bot3/conversations.db
      - PROMPT_FILE=/data/bots/bot3/prompt.txt
      - IMAGE_PROMPT_FILE=/data/bots/bot3/image_prompt.txt
      - OPENAI_API_KEY=${OPENAI_API_KEY_3}
      - GOOGLE_SHEETS_CREDENTIALS=${GOOGLE_SHEETS_CREDENTIALS}
      - GOOGLE_SHEET_ID=${GOOGLE_SHEET_ID}
      - GOOGLE_SHEET_NAME=${GOOGLE_SHEET_NAME}
      - OPENAI_ADMIN_KEY=${OPENAI_ADMIN_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN_3}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID_3}
    volumes:
      - ./sessions/bot3:/app/.wwebjs_auth
      - ./shared:/data
      - ./shared/secrets/gcp.json:/secrets/gcp.json
      - ./static:/app/static
    restart: unless-stopped
    networks:
      - whatsapp-net

  # Central Admin Panel
  central-admin:
    build: ./central-admin
    container_name: central-admin
    environment:
      - BOT1_USER=${BOT1_USER}
      - BOT1_PASS=${BOT1_PASS}
      - BOT2_USER=${BOT2_USER}
      - BOT2_PASS=${BOT2_PASS}
      - BOT3_PASS=${BOT3_PASS}
      - BOT3_USER=${BOT3_USER}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_API_KEY_2=${OPENAI_API_KEY_2}
      - OPENAI_API_KEY_3=${OPENAI_API_KEY_3}
      - OPENAI_ADMIN_KEY=${OPENAI_ADMIN_KEY}
      - OPENAI_PROJECT_ID=${OPENAI_PROJECT_ID}
      - OPENAI_PROJECT_ID_2=${OPENAI_PROJECT_ID_2}
      - OPENAI_PROJECT_ID_3=${OPENAI_PROJECT_ID_3}
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./shared:/data
      - ./static:/app/static
    ports:
      - "8000:8000"
    depends_on:
      - bot1
      - bot2
      - bot3
      - postgres
    restart: unless-stopped
    networks:
      - whatsapp-net

  # PostgreSQL Database
  postgres:
    image: ankane/pgvector
    container_name: whatsapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - whatsapp-net

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: whatsapp-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./static:/app/static
    depends_on:
      - bot1
      - bot2
      - bot3
      - central-admin
    restart: unless-stopped
    networks:
      - whatsapp-net

networks:
  whatsapp-net:
    driver: bridge

volumes:
  sessions:
  shared:
  pgdata:

